name: Release

on:
  # Fires when a tag is pushed *with git*. Creating a tag through the web UI
  # (including from the Releases page) fires `create`, not `push`, so it will
  # not start this workflow: that is what the `release` trigger below is for.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Fires when a release is published from the web UI. Creating a release on a
  # tag that already exists creates no tag, so no push event happens and the
  # trigger above never sees it. No recursion risk: the release this workflow
  # publishes itself uses GITHUB_TOKEN, and GITHUB_TOKEN actions do not trigger
  # further workflow runs.
  release:
    types: [published]
  # So the builds and the verify step can be exercised without publishing.
  workflow_dispatch:

jobs:
  # ── Linux x86_64 ──────────────────────────────────────────────────────────
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - uses: actions/checkout@v4
        with:
          path: TeAr
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Checkout FxmeJuceTools
        uses: actions/checkout@v4
        with:
          repository: odoare/FxmeJuceTools
          path: _fxme_tmp

      - name: Install FxmeJuceTools module
        shell: bash
        run: |
          mkdir -p JUCE/usermodules
          mv _fxme_tmp/module/FxmeJuceTools JUCE/usermodules/FxmeJuceTools

      - name: Configure & Build
        run: |
          cmake -B TeAr/build -S TeAr -DCMAKE_BUILD_TYPE=Release
          cmake --build TeAr/build --config Release --parallel

      - name: Package
        run: |
          cd TeAr/build/TeAr_artefacts/Release
          zip -r ${{ github.workspace }}/TeAr-VST3-Linux-x86_64.zip VST3/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: TeAr-VST3-Linux-x86_64.zip

  # ── Linux arm64 ───────────────────────────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - uses: actions/checkout@v4
        with:
          path: TeAr
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Checkout FxmeJuceTools
        uses: actions/checkout@v4
        with:
          repository: odoare/FxmeJuceTools
          path: _fxme_tmp

      - name: Install FxmeJuceTools module
        shell: bash
        run: |
          mkdir -p JUCE/usermodules
          mv _fxme_tmp/module/FxmeJuceTools JUCE/usermodules/FxmeJuceTools

      - name: Configure & Build
        run: |
          cmake -B TeAr/build -S TeAr -DCMAKE_BUILD_TYPE=Release
          cmake --build TeAr/build --config Release --parallel

      - name: Package
        run: |
          cd TeAr/build/TeAr_artefacts/Release
          zip -r ${{ github.workspace }}/TeAr-VST3-Linux-arm64.zip VST3/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: TeAr-VST3-Linux-arm64.zip

  # ── Windows x86_64 ────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: TeAr
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Checkout FxmeJuceTools
        uses: actions/checkout@v4
        with:
          repository: odoare/FxmeJuceTools
          path: _fxme_tmp

      - name: Install FxmeJuceTools module
        shell: bash
        run: |
          mkdir -p JUCE/usermodules
          mv _fxme_tmp/module/FxmeJuceTools JUCE/usermodules/FxmeJuceTools

      - name: Configure & Build
        run: |
          cmake -B TeAr/build -S TeAr
          cmake --build TeAr/build --config Release --parallel

      - name: Package raw VST3 zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "TeAr/build/TeAr_artefacts/Release/VST3" `
            -DestinationPath "TeAr-VST3-Windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-vst3
          path: TeAr-VST3-Windows-x86_64.zip

  # ── macOS universal (arm64 + x86_64) ──────────────────────────────────────
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: TeAr
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Checkout FxmeJuceTools
        uses: actions/checkout@v4
        with:
          repository: odoare/FxmeJuceTools
          path: _fxme_tmp

      - name: Install FxmeJuceTools module
        shell: bash
        run: |
          mkdir -p JUCE/usermodules
          mv _fxme_tmp/module/FxmeJuceTools JUCE/usermodules/FxmeJuceTools

      - name: Configure & Build
        run: |
          # Passed here as well as in CMakeLists: a -D is in the cache before
          # any CMakeLists line runs, so it cannot be lost to file ordering.
          cmake -B TeAr/build -S TeAr \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          # BinaryData alone first, serially: juceaide generating the resource
          # blob in parallel with the rest is a known OOM/race.
          cmake --build TeAr/build --config Release --target TeArBinaryData --parallel 1
          # Capped: a universal build doubles the compile and link load.
          cmake --build TeAr/build --config Release --parallel 2

      - name: Verify universal binaries
        run: |
          set -euo pipefail
          ART=TeAr/build/TeAr_artefacts/Release
          status=0
          for bundle in \
            "$ART/VST3/TeAr.vst3/Contents/MacOS/TeAr" \
            "$ART/AU/TeAr.component/Contents/MacOS/TeAr"
          do
            if [[ ! -f "$bundle" ]]; then
              echo "::error::missing binary: $bundle"; status=1; continue
            fi
            info=$(lipo -info "$bundle")
            echo "$info"
            for arch in x86_64 arm64; do
              grep -qw "$arch" <<< "$info" || { echo "::error::$bundle has no $arch slice"; status=1; }
            done
            vtool -show-build "$bundle" | grep -E 'minos|platform' || true
          done
          exit $status

      # Ad-hoc signature: free, no Apple account. It only makes the bundle
      # internally consistent (arm64 code needs *some* signature to run, and
      # packaging can invalidate the linker's). It is NOT notarisation and does
      # nothing for Gatekeeper — see the quarantine note in the README.
      - name: Ad-hoc codesign
        run: |
          set -euo pipefail
          ART=TeAr/build/TeAr_artefacts/Release
          for b in "$ART/VST3/TeAr.vst3" "$ART/AU/TeAr.component"; do
            codesign --force --deep --sign - --timestamp=none "$b"
            codesign --verify --verbose "$b"
          done

      - name: Build pkg installer
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          # Manual workflow_dispatch runs have no tag; keep in step with project().
          [[ "$VERSION" =~ ^[0-9] ]] || VERSION="0.4.0"
          mkdir -p pkg_root/Library/Audio/Plug-Ins/VST3
          mkdir -p pkg_root/Library/Audio/Plug-Ins/Components
          cp -r "TeAr/build/TeAr_artefacts/Release/VST3/TeAr.vst3" \
                "pkg_root/Library/Audio/Plug-Ins/VST3/"
          cp -r "TeAr/build/TeAr_artefacts/Release/AU/TeAr.component" \
                "pkg_root/Library/Audio/Plug-Ins/Components/"
          pkgbuild \
            --root pkg_root \
            --identifier com.fx-mechanics.TeAr \
            --version "$VERSION" \
            --install-location / \
            TeAr-macOS.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: TeAr-macOS.pkg

      - name: Package raw zips
        run: |
          # -y stores symlinks as symlinks rather than following them, which is
          # what keeps a macOS bundle (and its signature) intact through a zip.
          cd TeAr/build/TeAr_artefacts/Release
          zip -ry ${{ github.workspace }}/TeAr-VST3-macOS-universal.zip VST3/
          zip -ry ${{ github.workspace }}/TeAr-AU-macOS-universal.zip AU/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-vst3
          path: TeAr-VST3-macOS-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-au
          path: TeAr-AU-macOS-universal.zip

  # ── Publish GitHub Release ────────────────────────────────────────────────
  release:
    needs: [build-linux-x86_64, build-linux-arm64, build-windows, build-macos]
    # Manual runs build and verify only; publishing needs a tag.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # OIDC token for provenance signing
      attestations: write  # record build-provenance attestations
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.pkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.pkg
          generate_release_notes: true
