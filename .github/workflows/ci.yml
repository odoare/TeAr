name: CI

# Runs on every push to main and on pull requests, not only when someone
# remembers to press the button. This repository is public, so GitHub-hosted
# minutes (macOS runners included) are free.
#
# Tag pushes are deliberately not matched here: `branches:` excludes them, and
# release.yml already builds, verifies and publishes on a tag.
#
# paths-ignore *skips* the workflow rather than passing it, which would leave a
# required status check pending forever. `main` has no branch protection, so
# that is not an issue today; drop these filters if required checks are ever
# turned on.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# A second push supersedes the first: no point finishing a universal macOS
# build for a commit that has already been replaced. Keyed by ref, so a pull
# request and a push to main never cancel each other. Two runs on the same ref
# do cancel, manual dispatches included, which is the intended behaviour: they
# are testing the same commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Linux x86_64 ────────────────────────────────────────────────────────
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - uses: actions/checkout@v4
        with:
          path: TeAr
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Checkout FxmeJuceTools
        uses: actions/checkout@v4
        with:
          repository: odoare/FxmeJuceTools
          path: _fxme_tmp

      - name: Install FxmeJuceTools module
        run: |
          mkdir -p JUCE/usermodules
          mv _fxme_tmp/module/FxmeJuceTools JUCE/usermodules/FxmeJuceTools

      - name: Configure & Build
        run: |
          cmake -B TeAr/build -S TeAr -DCMAKE_BUILD_TYPE=Release
          cmake --build TeAr/build --config Release --parallel

  # ── Linux arm64 ─────────────────────────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - uses: actions/checkout@v4
        with:
          path: TeAr
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Checkout FxmeJuceTools
        uses: actions/checkout@v4
        with:
          repository: odoare/FxmeJuceTools
          path: _fxme_tmp

      - name: Install FxmeJuceTools module
        run: |
          mkdir -p JUCE/usermodules
          mv _fxme_tmp/module/FxmeJuceTools JUCE/usermodules/FxmeJuceTools

      - name: Configure & Build
        run: |
          cmake -B TeAr/build -S TeAr -DCMAKE_BUILD_TYPE=Release
          cmake --build TeAr/build --config Release --parallel

  # ── Windows x86_64 ──────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: TeAr
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Checkout FxmeJuceTools
        uses: actions/checkout@v4
        with:
          repository: odoare/FxmeJuceTools
          path: _fxme_tmp

      - name: Install FxmeJuceTools module
        shell: bash
        run: |
          mkdir -p JUCE/usermodules
          mv _fxme_tmp/module/FxmeJuceTools JUCE/usermodules/FxmeJuceTools

      - name: Configure & Build
        run: |
          cmake -B TeAr/build -S TeAr
          cmake --build TeAr/build --config Release --parallel

  # ── macOS universal (arm64 + x86_64) ────────────────────────────────────
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: TeAr
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Checkout FxmeJuceTools
        uses: actions/checkout@v4
        with:
          repository: odoare/FxmeJuceTools
          path: _fxme_tmp

      - name: Install FxmeJuceTools module
        run: |
          mkdir -p JUCE/usermodules
          mv _fxme_tmp/module/FxmeJuceTools JUCE/usermodules/FxmeJuceTools

      - name: Configure & Build
        run: |
          cmake -B TeAr/build -S TeAr \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          cmake --build TeAr/build --config Release --target TeArBinaryData --parallel 1
          cmake --build TeAr/build --config Release --parallel 2

      - name: Verify universal binaries
        run: |
          set -euo pipefail
          ART=TeAr/build/TeAr_artefacts/Release
          status=0
          for bundle in \
            "$ART/VST3/TeAr.vst3/Contents/MacOS/TeAr" \
            "$ART/AU/TeAr.component/Contents/MacOS/TeAr"
          do
            if [[ ! -f "$bundle" ]]; then
              echo "::error::missing binary: $bundle"; status=1; continue
            fi
            info=$(lipo -info "$bundle")
            echo "$info"
            for arch in x86_64 arm64; do
              grep -qw "$arch" <<< "$info" || { echo "::error::$bundle has no $arch slice"; status=1; }
            done
            vtool -show-build "$bundle" | grep -E 'minos|platform' || true
          done
          exit $status
